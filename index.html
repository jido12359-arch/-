<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>مطعم لذيذ</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      direction: rtl;
      background: #f8f8f8;
    }

    header {
      background: #222;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
    }

    .hero {
      height: 90vh;
      background: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836') no-repeat center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
    }

    .hero h1 {
      font-size: 50px;
      background: rgba(131, 13, 13, 0.5);
      padding: 20px;
      border-radius: 10px;
    }

    .menu {
      padding: 40px;
      text-align: center;
    }

    .menu-items {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .item {
      background: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836') no-repeat center/cover;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgb(255, 255, 255);
      color: #ffffff;
    }

    footer {
      background: #ff0000;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="menu-items">
